[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nutripilot"
version = "1.0.0"
description = "Observable and evaluable multi-agent personalized nutrition decision system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "NutriPilot" }]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "mcp>=1.10,<2",
  "openai>=1.95,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.14,<2",
  "redis>=6,<8",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "structlog>=25.1,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
nutripilot-eval = "nutripilot.evaluation.cli:main"

[project.optional-dependencies]
observability = ["langfuse>=3,<4"]
ml = [
  "FlagEmbedding>=1.3,<2",
  "sentence-transformers>=5,<6",
]
dev = [
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nutripilot", "apps"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "integration: tests requiring multiple application components",
  "real_model: tests that require a paid or remote model",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["web", "migrations"]

[[tool.mypy.overrides]]
module = ["langfuse.*", "qdrant_client.*", "mcp.*"]
ignore_missing_imports = true
