name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev ruff check .
      - run: MYPYPATH=src uv run --extra dev mypy --explicit-package-bases src/nutripilot apps
      - run: uv run --extra dev pytest --cov=nutripilot --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --extra dev --extra e2e
      - run: npm --prefix web ci
      - run: uv run --extra e2e playwright install --with-deps chromium
      - run: uv run --extra e2e python scripts/demo_launcher.py --background
      - run: uv run --extra e2e python scripts/verify_web.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: .runtime/web-regression

